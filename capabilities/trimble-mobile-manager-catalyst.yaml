naftiko: 1.0.0-alpha2
info:
  label: Trimble Mobile Manager API — Catalyst
  description: 'Trimble Mobile Manager API — Catalyst. 2 operations. Lead operation: Get Catalyst Licenses. Self-contained
    Naftiko capability covering one Trimble Navigation business surface.'
  tags:
  - Trimble Navigation
  - Catalyst
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRIMBLE_NAVIGATION_API_KEY: TRIMBLE_NAVIGATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: trimble-mobile-manager-catalyst
    baseUri: http://localhost:{apiPort}
    description: Trimble Mobile Manager API — Catalyst business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-catalyst-licenses
      path: /api/v1/catalyst/licenses
      operations:
      - name: getcatalystlicenses
        method: GET
        description: Get Catalyst Licenses
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-v1-catalyst-licenses-activate
      path: /api/v1/catalyst/licenses/activate
      operations:
      - name: activatecatalystlicense
        method: POST
        description: Activate Catalyst License
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.TRIMBLE_NAVIGATION_USER}}'
      password: '{{env.TRIMBLE_NAVIGATION_PASS}}'
  exposes:
  - type: rest
    namespace: trimble-mobile-manager-catalyst-rest
    port: 8080
    description: REST adapter for Trimble Mobile Manager API — Catalyst. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v1/catalyst/licenses
      name: api-v1-catalyst-licenses
      description: REST surface for api-v1-catalyst-licenses.
      operations:
      - method: GET
        name: getcatalystlicenses
        description: Get Catalyst Licenses
        call: trimble-mobile-manager-catalyst.getcatalystlicenses
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/catalyst/licenses/activate
      name: api-v1-catalyst-licenses-activate
      description: REST surface for api-v1-catalyst-licenses-activate.
      operations:
      - method: POST
        name: activatecatalystlicense
        description: Activate Catalyst License
        call: trimble-mobile-manager-catalyst.activatecatalystlicense
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: trimble-mobile-manager-catalyst-mcp
    port: 9090
    transport: http
    description: MCP adapter for Trimble Mobile Manager API — Catalyst. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-catalyst-licenses
      description: Get Catalyst Licenses
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: trimble-mobile-manager-catalyst.getcatalystlicenses
      outputParameters:
      - type: object
        mapping: $.
    - name: activate-catalyst-license
      description: Activate Catalyst License
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: trimble-mobile-manager-catalyst.activatecatalystlicense
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
