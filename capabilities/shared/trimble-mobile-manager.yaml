naftiko: "1.0.0-alpha1"

info:
  label: "Trimble Mobile Manager API"
  description: >-
    Trimble Mobile Manager local REST API for GNSS receiver integration.
    Provides system information, position stream initialization, receiver
    configuration, corrections management, and Catalyst license activation.
    Runs locally on the device at localhost.
  tags:
    - GPS
    - GNSS
    - Positioning
    - Navigation
    - Surveying
    - Mobile
    - Trimble Navigation
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TMM_APP_ID: TMM_APP_ID

capability:
  consumes:
    - type: http
      namespace: trimble-tmm
      baseUri: http://localhost:8080
      description: "Trimble Mobile Manager local REST API"
      authentication:
        type: basic
        username: "{{TMM_APP_ID}}"
        password: "{{TMM_ACCESS_CODE}}"
      resources:
        - name: system
          path: /api/v1/tmmInfo
          description: TMM system information
          operations:
            - name: get-tmm-info
              method: GET
              description: Get TMM version, API port, and WebSocket ports
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: positioning
          path: /api/v1/positionStream
          description: GNSS position streaming
          operations:
            - name: start-position-stream
              method: GET
              description: Initiate GNSS position streaming, returns WebSocket port
              inputParameters:
                - name: format
                  in: query
                  type: string
                  required: false
                  description: Position format (locationV1 or locationV2)
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: receiver
          path: /api/v1/receiver
          description: GNSS receiver management
          operations:
            - name: get-receiver-info
              method: GET
              description: Get connected receiver model and firmware details
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-receiver-status
              method: GET
              description: Get current receiver status
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: corrections
          path: /api/v1/corrections
          description: GNSS correction service management
          operations:
            - name: get-corrections-status
              method: GET
              description: Get active correction service status and accuracy
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: configure-corrections
              method: POST
              description: Configure correction source (RTX, RTK, SBAS, NTRIP)
              body:
                type: json
                data:
                  type: "{{tools.type}}"
                  ntripHost: "{{tools.ntripHost}}"
                  ntripMountpoint: "{{tools.ntripMountpoint}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: catalyst
          path: /api/v1/catalyst
          description: Trimble Catalyst license management
          operations:
            - name: get-catalyst-licenses
              method: GET
              description: Get available Catalyst accuracy licenses
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: activate-catalyst-license
              method: POST
              description: Activate a Catalyst On Demand license
              body:
                type: json
                data:
                  licenseId: "{{tools.licenseId}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: trimble-nav-rest
      resources:
        - path: /v1/position
          name: position
          description: GNSS positioning
          operations:
            - method: GET
              name: start-position-stream
              description: Initiate position streaming
              call: "trimble-tmm.start-position-stream"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: trimble-nav-mcp
      transport: http
      tools:
        - name: get-tmm-info
          description: Get Trimble Mobile Manager system info and WebSocket ports
          hints:
            readOnly: true
            openWorld: false
          call: "trimble-tmm.get-tmm-info"
          outputParameters:
            - type: object
              mapping: "$."
        - name: start-position-stream
          description: Initiate GNSS position streaming, returns WebSocket port
          hints:
            readOnly: false
            openWorld: false
          call: "trimble-tmm.start-position-stream"
          with:
            format: "tools.format"
          outputParameters:
            - type: object
              mapping: "$."
