naftiko: 1.0.0-alpha2
info:
  label: Trimble Mobile Manager API — Positioning
  description: 'Trimble Mobile Manager API — Positioning. 1 operations. Lead operation: Start Position Stream. Self-contained
    Naftiko capability covering one Trimble Navigation business surface.'
  tags:
  - Trimble Navigation
  - Positioning
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRIMBLE_NAVIGATION_API_KEY: TRIMBLE_NAVIGATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: trimble-mobile-manager-positioning
    baseUri: http://localhost:{apiPort}
    description: Trimble Mobile Manager API — Positioning business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-positionStream
      path: /api/v1/positionStream
      operations:
      - name: startpositionstream
        method: GET
        description: Start Position Stream
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: format
          in: query
          type: string
          description: Position data format version. locationV2 includes extended fields for IMU orientation, TIP positions,
            and reference frame data.
    authentication:
      type: basic
      username: '{{env.TRIMBLE_NAVIGATION_USER}}'
      password: '{{env.TRIMBLE_NAVIGATION_PASS}}'
  exposes:
  - type: rest
    namespace: trimble-mobile-manager-positioning-rest
    port: 8080
    description: REST adapter for Trimble Mobile Manager API — Positioning. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v1/positionstream
      name: api-v1-positionstream
      description: REST surface for api-v1-positionStream.
      operations:
      - method: GET
        name: startpositionstream
        description: Start Position Stream
        call: trimble-mobile-manager-positioning.startpositionstream
        with:
          format: rest.format
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: trimble-mobile-manager-positioning-mcp
    port: 9090
    transport: http
    description: MCP adapter for Trimble Mobile Manager API — Positioning. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: start-position-stream
      description: Start Position Stream
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: trimble-mobile-manager-positioning.startpositionstream
      with:
        format: tools.format
      outputParameters:
      - type: object
        mapping: $.
