aid: trimble-navigation
name: Trimble Navigation
description: >-
  Trimble Navigation Limited (now Trimble Inc.) is a global technology company founded in 1978 that pioneered commercial
  GPS technology. Trimble develops positioning, navigation, and geospatial solutions spanning construction, agriculture,
  transportation, and surveying industries. The company rebranded from Trimble Navigation Limited to Trimble Inc. in
  2016. Its developer APIs cover GPS/GNSS positioning through Trimble Mobile Manager, high-accuracy survey integration
  via the Trimble Precision SDK, and geospatial data services. The positioning technology integrates GPS, laser,
  optical, and inertial technologies to deliver centimeter-level accuracy for professional applications.
